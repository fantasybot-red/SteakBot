[project]
name = "streakbot"
version = "0.1.0"
description = "A Discord bot that tracks TikTok-style chat & voice streaks using discord.py and Beanie (MongoDB)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4.0",
    "beanie>=2.0.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
]

[tool.uv]
package = false
